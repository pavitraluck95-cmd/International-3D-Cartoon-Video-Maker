name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "public/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add native Android Gallery saver
        run: |
          mkdir -p android/app/src/main/java/com/international3dcartoon/videomaker
          cat > android/app/src/main/java/com/international3dcartoon/videomaker/MainActivity.java <<'JAVA'
          package com.international3dcartoon.videomaker;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import java.io.OutputStream;
          import java.io.File;
          import java.nio.file.Files;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends BridgeActivity {
            private TextToSpeech hindiTts;
            private volatile boolean ttsReady = false;
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new GallerySaver(), "AndroidSaveVideo");
              getBridge().getWebView().addJavascriptInterface(new NativeSpeech(), "AndroidTTS");
              hindiTts = new TextToSpeech(this, status -> {
                if (status == TextToSpeech.SUCCESS) {
                  int lang = hindiTts.setLanguage(new Locale("hi", "IN"));
                  ttsReady = lang != TextToSpeech.LANG_MISSING_DATA && lang != TextToSpeech.LANG_NOT_SUPPORTED;
                }
              });
              hindiTts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                @Override public void onStart(String id) {}
                @Override public void onError(String id) { sendTtsError(id, "Android हिंदी आवाज़ उपलब्ध नहीं है।"); }
                @Override public void onDone(String id) {
                  try {
                    File audio = new File(getCacheDir(), id + ".wav");
                    byte[] bytes = Files.readAllBytes(audio.toPath());
                    String encoded = Base64.encodeToString(bytes, Base64.NO_WRAP);
                    final int chunk = 180000;
                    for (int p = 0; p < encoded.length(); p += chunk) {
                      String part = encoded.substring(p, Math.min(encoded.length(), p + chunk));
                      boolean last = p + chunk >= encoded.length();
                      String js = "window.onNativeTtsChunk && window.onNativeTtsChunk('" + id + "','" + part + "'," + last + ")";
                      getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(js, null));
                    }
                    audio.delete();
                  } catch (Exception e) { sendTtsError(id, "हिंदी आवाज़ की ऑडियो फ़ाइल पढ़ नहीं पाए।"); }
                }
              });
            }
            private void sendTtsError(String id, String message) {
              String safe = message.replace("'", "\\'");
              getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(
                "window.onNativeTtsError && window.onNativeTtsError('" + id + "','" + safe + "')", null));
            }
            public class NativeSpeech {
              @JavascriptInterface public boolean synthesize(String text, String id) {
                if (!ttsReady || text == null || text.trim().isEmpty()) return false;
                File file = new File(getCacheDir(), id + ".wav");
                android.os.Bundle params = new android.os.Bundle();
                params.putString(TextToSpeech.Engine.KEY_PARAM_UTTERANCE_ID, id);
                int result = hindiTts.synthesizeToFile(text, params, file, id);
                return result == TextToSpeech.SUCCESS;
              }
            }

            public class GallerySaver {
              private Uri pendingUri;
              private Uri lastSavedUri;
              private OutputStream pendingOutput;

              @JavascriptInterface
              public synchronized boolean beginSave(String filename) {
                try {
                  cancelSaveInternal();
                  String safeName = (filename == null || !filename.endsWith(".mp4"))
                    ? "cartoon-video.mp4" : filename.replaceAll("[^A-Za-z0-9._-]", "_");
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Video.Media.DISPLAY_NAME, safeName);
                  values.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    values.put(MediaStore.Video.Media.RELATIVE_PATH,
                      Environment.DIRECTORY_MOVIES + "/International 2D Cartoon Video Maker");
                    values.put(MediaStore.Video.Media.IS_PENDING, 1);
                  }
                  pendingUri = getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values);
                  if (pendingUri == null) return false;
                  pendingOutput = getContentResolver().openOutputStream(pendingUri, "w");
                  if (pendingOutput == null) { cancelSaveInternal(); return false; }
                  return true;
                } catch (Exception error) {
                  cancelSaveInternal();
                  return false;
                }
              }

              @JavascriptInterface
              public synchronized boolean appendChunk(String base64) {
                try {
                  if (pendingOutput == null || base64 == null) return false;
                  pendingOutput.write(Base64.decode(base64, Base64.DEFAULT));
                  return true;
                } catch (Exception error) {
                  return false;
                }
              }

              @JavascriptInterface
              public synchronized boolean finishSave() {
                try {
                  if (pendingOutput == null || pendingUri == null) return false;
                  pendingOutput.flush();
                  pendingOutput.close();
                  pendingOutput = null;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues ready = new ContentValues();
                    ready.put(MediaStore.Video.Media.IS_PENDING, 0);
                    getContentResolver().update(pendingUri, ready, null, null);
                  }
                  lastSavedUri = pendingUri;
                  pendingUri = null;
                  return true;
                } catch (Exception error) {
                  cancelSaveInternal();
                  return false;
                }
              }

              @JavascriptInterface
              public void openGallery() {
                runOnUiThread(() -> {
                  try {
                    Uri target = lastSavedUri != null ? lastSavedUri : MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                    android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                    intent.setDataAndType(target, "video/*");
                    intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                    intent.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                    startActivity(intent);
                  } catch (Exception ignored) {
                    try {
                      android.content.Intent fallback = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                      fallback.setType("video/*");
                      fallback.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(fallback);
                    } catch (Exception ignoredAgain) {}
                  }
                });
              }

              @JavascriptInterface
              public synchronized void cancelSave() { cancelSaveInternal(); }

              private void cancelSaveInternal() {
                try { if (pendingOutput != null) pendingOutput.close(); } catch (Exception ignored) {}
                pendingOutput = null;
                if (pendingUri != null) {
                  try { getContentResolver().delete(pendingUri, null, null); } catch (Exception ignored) {}
                }
                pendingUri = null;
              }
            }
          }
          JAVA
          grep -q 'MainActivity' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: international-3d-cartoon-video-maker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
